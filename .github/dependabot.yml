version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-security-and-maintenance:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-security-and-maintenance:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
